[package]
name = "rose-login-manager"
version = "1.2.0"
description = "ROSE Online Login Manager"
authors = ["arafuls"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
# Exact-pinned to match @tauri-apps/api's pinned npm version (package.json)
# - the Rust tauri crate publishes patch releases independently of the npm
# package, so these two must be checked against each other directly rather
# than assumed to line up from independent semver ranges. 2.10.1 (an
# earlier candidate) turned out to have a real API mismatch against its
# own tauri-runtime/tauri-runtime-wry sibling crates (a Sync bound
# difference) even in a from-scratch dependency resolution - 2.11.1
# compiles cleanly with its actual siblings.
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-process = "2.3.1"

# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto: Argon2id passphrase -> key derivation, AES-256-GCM authenticated encryption
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Settings / game config
toml = "0.8"
dirs = "5"

# Error ergonomics
thiserror = "1"
tauri-plugin-dialog = "2"
data-encoding = "2"
tokio = { version = "=1.53.1", features = ["sync", "fs", "time", "macros"] }
bitar = { version = "0.14", features = ["compress", "zstd-compression"] }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "brotli", "rustls"] }
tracing = "0.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-os = "2.3.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

# Windows-only: registry lookup (game install folder, HKLM + HKCU) and Win32
# window APIs ("launch client behind" window positioning). Both were
# previously plain [dependencies] despite every call site already being
# behind #[cfg(windows)] in source - Cargo still compiled the crates
# themselves unconditionally regardless of that, which genuinely fails on
# non-Windows targets (confirmed via a real Linux build: windows-future, a
# transitive dependency of `windows`, fails to compile at all outside
# Windows). Gating them here, not just their call sites, is what actually
# fixes that.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "=0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Cryptography"] }

# Linux "stay unlocked" via Secret Service, sync D-Bus only - no async
# runtime, no kernel-keyutils fallback (out of scope). Pinned to 3.x; v4
# is an incompatible rewrite.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
